<h1>Life OS</h1>
<p>Life OS is a private, single-user tool. It runs on its owner's own computer and uses the Gmail and Google Drive APIs to turn the owner's own inbox into a short daily list of actions.</p>
<p>It is not offered to the public and has no other users.</p>
